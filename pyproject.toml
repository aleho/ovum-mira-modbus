[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovum-mira-modbus"
version = "0.0.6"
description = "Read and control an Ovum Mira heat pump system over Modbus."
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
authors = [{ name = "Alexander Hofbauer" }]
keywords = ["modbus", "ovum", "mira", "heatpump", "heating"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["modbus-connection>=4.12.1,<5"]

[project.optional-dependencies]
cli = ["modbus-connection[tmodbus]>=4.12.1,<5"]

[project.urls]
Repository = "https://github.com/aleho/ovum-mira-modbus"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ovum_mira_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src"]
extend-exclude = [
    "src/ovum_mira_modbus/addr.py",
    "src/ovum_mira_modbus/enum.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
